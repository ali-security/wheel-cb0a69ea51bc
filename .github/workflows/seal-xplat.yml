name: Run the test suite (seal cross-platform)

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "pypy-3.9", "pypy-3.10"]
        include:
        - os: macos-latest
          python-version: "3.8"
        - os: windows-latest
          python-version: "3.8"
        - os: macos-latest
          python-version: "3.12"
        - os: windows-latest
          python-version: "3.12"
        - os: macos-latest
          python-version: "pypy-3.10"
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip
        cache-dependency-path: pyproject.toml
    - name: Install the project
      run: pip install --no-binary=wheel .
    - name: Install test dependencies
      run: pip install .[test] coverage[toml]
    - name: Include SDist check dependencies
      if: matrix.python-version == '3.12'
      run: pip install build flit
    # CI drift: pyproject's test extra asks for `setuptools >= 65`, which now
    # resolves to a modern release whose PEP 625 filename normalization and
    # license-file relocation break this version's test suite (14 failures in
    # tests/test_bdist_wheel.py + tests/test_tagopt.py). 69.5.1 is the release
    # contemporary with wheel 0.43.0 and is the same pin the verified Linux
    # build uses. Installed last so it wins over the extra's resolution.
    - name: Pin setuptools to the release contemporary with wheel 0.43.0
      run: pip install "setuptools==69.5.1"
    - name: Test with pytest
      run: coverage run -m pytest -v
      env:
        PYTHONWARNDEFAULTENCODING: 1
